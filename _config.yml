  # _projects
  - scope:
      path: ""
      type: collection
      order:
        - capsized.md
        - blekeypad.md
        - deej.md
        - nixieclock.md
    values:
      entries_layout: grid
      author_profile: true
      classes: wide

  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      classes: wide


collections:
  projects:
    permalink: /:collection/:path/
    output: true
    order:
      - capsized.md
      - blekeypad.md
      - deej.md
      - nixieclock.md


category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
